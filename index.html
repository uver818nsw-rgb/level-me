<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LEVEL:ME</title>

  <!-- フォント -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#0F1115;
      color:#F3F4F6;
      font-family:'Inter', sans-serif;
      min-height:100vh;
    }

    .app{
      max-width:500px;
      margin:auto;
      padding:20px;
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }

    .small-text{
      color:#888;
      font-size:12px;
    }

    h1{
      font-size:42px;
    }

    .card{
      background:#181C23;
      border:1px solid rgba(255,255,255,0.05);
      border-radius:20px;
      padding:20px;
      margin-bottom:16px;
      backdrop-filter:blur(10px);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-2px);
    }

    .streak-box{
      background:#222833;
      padding:10px 14px;
      border-radius:14px;
      font-weight:600;
    }

    .exp-top{
      display:flex;
      justify-content:space-between;
      margin-bottom:10px;
    }

    .exp-bar{
      width:100%;
      height:16px;
      background:#2A2F3A;
      border-radius:999px;
      overflow:hidden;
    }

    .exp-fill{
      width:0%;
      height:100%;
      background:linear-gradient(90deg,#FFD166,#7C5CFF);
      transition:0.4s;
      box-shadow: 0 0 10px rgba(255,209,102,0.5);
    }

    .message{
      font-size:18px;
      line-height:1.6;
      color:#DDD;
    }

    .status-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:16px;
    }

    .status-item{
      background:#222833;
      padding:16px;
      border-radius:16px;
    }

    .status-item span{
      display:block;
      color:#AAA;
      margin-bottom:6px;
    }

    .status-item strong{
      font-size:24px;
    }

    .quest{
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:#222833;
      padding:14px;
      border-radius:14px;
      margin-top:12px;
    }

    .quest-info span.tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
      background: #333a4d;
      color: #FFD166;
      margin-right: 6px;
    }

    .quest button{
      border:none;
      background:#7C5CFF;
      color:white;
      padding:10px 14px;
      border-radius:12px;
      cursor:pointer;
      transition:0.2s;
    }

    .quest button:active{
      transform:scale(0.92);
    }

    .quest button:disabled{
      background:#4ADE80;
      opacity:0.8;
      cursor:default;
    }

    textarea{
      width:100%;
      min-height:120px;
      margin-top:16px;
      background:#222833;
      border:none;
      border-radius:16px;
      padding:16px;
      color:white;
      resize:none;
    }

    #saveFeeling{
      width:100%;
      margin-top:12px;
      border:none;
      padding:14px;
      border-radius:14px;
      background:#00D1B2;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    .levelup-modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.7);
      display:none;
      justify-content:center;
      align-items:center;
      z-index:999;
    }

    .levelup-content{
      background: radial-gradient(circle, #2a2f5f, #181C23);
      border:2px solid #FFD166;
      box-shadow: 0 0 20px #FFD166, 0 0 60px rgba(255,209,102,0.4);
      padding:40px;
      border-radius:24px;
      text-align:center;
      animation: pop 0.5s ease, glow 1.5s infinite alternate;
    }

    .levelup-content h2{
      font-size:40px;
      color:#FFD166;
    }

    .levelup-content p{
      font-size:28px;
      margin-top:10px;
    }

    @keyframes pop{
      0%{ transform:scale(0.6); opacity:0; }
      100%{ transform:scale(1); opacity:1; }
    }

    @keyframes glow{
      from{ box-shadow: 0 0 10px #FFD166, 0 0 30px rgba(255,209,102,0.2); }
      to{ box-shadow: 0 0 30px #FFD166, 0 0 80px rgba(255,209,102,0.6); }
    }

    #level{
      background:linear-gradient(90deg, #FFFFFF, #FFD166);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .name-box{
      display:flex;
      gap:10px;
      margin-top:14px;
    }

    .name-box input{
      flex:1;
      background:#222833;
      border:none;
      border-radius:12px;
      padding:14px;
      color:white;
      font-size:16px;
    }

    .name-box button{
      border:none;
      background:#7C5CFF;
      color:white;
      padding:0 18px;
      border-radius:12px;
      cursor:pointer;
    }

    #welcomeText{
      margin-top:14px;
      color:#AAA;
    }

    .title-box{
      margin-top:16px;
      background: linear-gradient(135deg, #7C5CFF, #00D1B2);
      padding:20px;
      border-radius:18px;
      text-align:center;
      box-shadow: 0 0 20px rgba(124,92,255,0.4);
    }

    #playerTitle{
      font-size:24px;
      font-weight:700;
      letter-spacing:2px;
    }

    .add-quest{
      display:flex;
      flex-direction: column;
      gap:10px;
      margin-top:16px;
      margin-bottom:16px;
    }

    .add-quest-row {
      display: flex;
      gap: 10px;
    }

    .add-quest input, .add-quest select{
      background:#222833;
      border:none;
      border-radius:12px;
      padding:12px;
      color:white;
    }

    #questNameInput{
      flex:1;
    }

    #questExpInput{
      width:90px;
    }

    #questStatSelect {
      flex: 1;
    }

    #addQuestBtn{
      border:none;
      background:#00D1B2;
      color:white;
      border-radius:12px;
      padding:12px;
      font-weight:bold;
      cursor:pointer;
    }

    #statusChart{
      width: 100% !important;
      height: 280px !important;
      display: block;
      margin-top: 10px;
    }

    #debugBtn {
      background: transparent;
      border: 1px solid #444;
      color: #666;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 10px;
      cursor: pointer;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="app">
  
  <!-- プレイヤー名 -->
  <section class="card">
    <h2>PLAYER NAME</h2>
    <div class="name-box">
      <input type="text" id="playerNameInput" placeholder="名前を入力...">
      <button id="saveName">決定</button>
    </div>
    <p id="welcomeText">ようこそ、冒険者。</p>
  </section>

  <!-- ヘッダー -->
  <header class="header">
    <button id="debugBtn">RESET</button>
    
    <div>
      <p class="small-text">YOUR LEVEL</p>
      <h1 id="level">Lv.1</h1>
    </div>

    <div class="streak-box">
      🔥 <span id="streak">1</span> Days
    </div>
  </header>

  <!-- EXP -->
  <section class="card">
    <div class="exp-top">
      <span>EXP</span>
      <span id="expText">0 / 100</span>
    </div>
    <div class="exp-bar">
      <div class="exp-fill" id="expFill"></div>
    </div>
  </section>

  <!-- メッセージ -->
  <section class="card">
    <p class="message">
      昨日の自分を、<br>
      少し超えられれば十分。
    </p>
  </section>

  <!-- 称号 -->
  <section class="card">
    <h2>TITLE</h2>
    <div class="title-box">
      <p id="playerTitle">E級 覚醒者</p>
    </div>
  </section>

  <!-- ステータス -->
  <section class="card">
    <h2>STATUS</h2>
    <canvas id="statusChart"></canvas>
    <div class="status-grid">
      <div class="status-item">
        <span>🧠 Mental</span>
        <strong id="mental">1</strong>
      </div>
      <div class="status-item">
        <span>💪 Discipline</span>
        <strong id="discipline">1</strong>
      </div>
      <div class="status-item">
        <span>❤️ Confidence</span>
        <strong id="confidence">1</strong>
      </div>
      <div class="status-item">
        <span>🌎 Social</span>
        <strong id="social">1</strong>
      </div>
    </div>
  </section>

  <!-- クエスト -->
  <section class="card">
    <h2>DAILY QUEST</h2>
    <div class="add-quest">
      <div class="add-quest-row">
        <input type="text" id="questNameInput" placeholder="新しいクエスト（例: 筋トレ20分）">
        <input type="number" id="questExpInput" placeholder="EXP" value="15">
      </div>
      <div class="add-quest-row">
        <select id="questStatSelect">
          <option value="discipline">💪 Discipline (規律・筋トレ)</option>
          <option value="mental">🧠 Mental (勉強・思考)</option>
          <option value="confidence">❤️ Confidence (挑戦・達成)</option>
          <option value="social">🌎 Social (対話・仕事)</option>
        </select>
        <button id="addQuestBtn">クエスト追加</button>
      </div>
    </div>
    <div id="questList"></div>
  </section>

  <!-- 感情ログ -->
  <section class="card">
    <h2>FEELING LOG</h2>
    <textarea id="feelingInput" placeholder="今日感じたことを書いてみよう..."></textarea>
    <button id="saveFeeling">保存する</button>
  </section>

</div>

<!-- レベルアップ モーダル -->
<div class="levelup-modal" id="levelupModal">
  <div class="levelup-content">
    <h2>LEVEL UP!</h2>
    <p id="newLevelText">Lv.2</p>
  </div>
</div>

<!-- 効果音 -->
<audio id="questSound" src="https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3"></audio>
<audio id="levelUpSound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>

<script>
const player = JSON.parse(localStorage.getItem("player")) || {
  level: 1,
  exp: 0,
  streak: 1,
  name: "",
  stats: {
    mental: 1,
    discipline: 1,
    confidence: 1,
    social: 1
  }
};

let quests = JSON.parse(localStorage.getItem("quests")) || [
  { name: "水を飲む", exp: 10, stat: "discipline" },
  { name: "5分散歩する", exp: 15, stat: "mental" }
];

const level = document.getElementById("level");
const expText = document.getElementById("expText");
const expFill = document.getElementById("expFill");
const streak = document.getElementById("streak");
const playerTitle = document.getElementById("playerTitle");

const mental = document.getElementById("mental");
const discipline = document.getElementById("discipline");
const confidence = document.getElementById("confidence");
const social = document.getElementById("social");

const playerNameInput = document.getElementById("playerNameInput");
const saveName = document.getElementById("saveName");
const welcomeText = document.getElementById("welcomeText");

const questList = document.getElementById("questList");
const questNameInput = document.getElementById("questNameInput");
const questExpInput = document.getElementById("questExpInput");
const questStatSelect = document.getElementById("questStatSelect");
const addQuestBtn = document.getElementById("addQuestBtn");

const levelupModal = document.getElementById("levelupModal");
const newLevelText = document.getElementById("newLevelText");

const questSound = document.getElementById("questSound");
const levelUpSound = document.getElementById("levelUpSound");

const statusChartCanvas = document.getElementById("statusChart");
let statusChart;

const statLabels = {
  mental: "🧠 Mental",
  discipline: "💪 Discipline",
  confidence: "❤️ Confidence",
  social: "🌎 Social"
};

function updateUI(){
  level.innerText = `Lv.${player.level}`;
  expText.innerText = `${player.exp} / 100`;
  expFill.style.width = `${Math.min(player.exp, 100)}%`;
  streak.innerText = player.streak;

  mental.innerText = player.stats.mental;
  discipline.innerText = player.stats.discipline;
  confidence.innerText = player.stats.confidence;
  social.innerText = player.stats.social;

  // レベルに応じた称号の変更
  if (player.level >= 20) playerTitle.innerText = "S級 覚醒者";
  else if (player.level >= 15) playerTitle.innerText = "A級 覚醒者";
  else if (player.level >= 10) playerTitle.innerText = "B級 覚醒者";
  else if (player.level >= 5) playerTitle.innerText = "C級 覚醒者";
  else if (player.level >= 3) playerTitle.innerText = "D級 覚醒者";
  else playerTitle.innerText = "E級 覚醒者";

  localStorage.setItem("player", JSON.stringify(player));
  createStatusChart();
}

function checkLevelUp() {
  if (player.exp >= 100) {
    player.level += 1;
    player.exp -= 100;

    newLevelText.innerText = `Lv.${player.level}`;
    levelupModal.style.display = "flex";
    
    levelUpSound.currentTime = 0;
    levelUpSound.play().catch(e => console.log("Sound play error:", e));

    setTimeout(() => {
      levelupModal.style.display = "none";
    }, 2500);
  }
}

function createStatusChart(){
  if(statusChart){
    statusChart.destroy();
  }

  statusChart = new Chart(statusChartCanvas, {
    type: "radar",
    data: {
      labels: ["Mental", "Discipline", "Confidence", "Social"],
      datasets: [{
        data: [
          player.stats.mental,
          player.stats.discipline,
          player.stats.confidence,
          player.stats.social
        ],
        backgroundColor: "rgba(124,92,255,0.2)",
        borderColor: "#7C5CFF",
        borderWidth: 2,
        pointBackgroundColor: "#FFD166"
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        r: {
          suggestedMin: 1,
          suggestedMax: Math.max(5, ...Object.values(player.stats)) + 2,
          grid: { color: "rgba(255, 255, 255, 0.1)" },
          angleLines: { color: "rgba(255, 255, 255, 0.1)" },
          pointLabels: { color: "#AAA", font: { size: 12 } },
          ticks: { display: false }
        }
      },
      plugins: {
        legend: { display: false }
      }
    }
  });
}

function renderQuests(){
  questList.innerHTML = "";

  quests.forEach((quest) => {
    const div = document.createElement("div");
    div.classList.add("quest");

    const statName = statLabels[quest.stat] || "💪 Discipline";

    div.innerHTML = `
      <div class="quest-info">
        <span class="tag">${statName}</span>
        <h3>${quest.name}</h3>
        <p style="font-size: 12px; color: #888;">+${quest.exp} EXP</p>
      </div>
      <button>完了</button>
    `;

    const button = div.querySelector("button");

    button.addEventListener("click", () => {
      player.exp += quest.exp;
      
      // 該当するステータスをアップ
      if (player.stats[quest.stat] !== undefined) {
        player.stats[quest.stat] += 1;
      } else {
        player.stats.discipline += 1;
      }
      
      questSound.currentTime = 0;
      questSound.play().catch(e => console.log("Sound play error:", e));

      checkLevelUp();
      updateUI();

      button.innerText = "達成!";
      button.disabled = true;
    });

    questList.appendChild(div);
  });

  localStorage.setItem("quests", JSON.stringify(quests));
}

saveName.addEventListener("click", () => {
  player.name = playerNameInput.value;
  welcomeText.innerText = `ようこそ、${player.name}。`;
  localStorage.setItem("player", JSON.stringify(player));
});

addQuestBtn.addEventListener("click", () => {
  const name = questNameInput.value;
  const exp = Number(questExpInput.value);
  const stat = questStatSelect.value;

  if(!name || !exp){
    return;
  }

  quests.push({ name, exp, stat });
  renderQuests();

  questNameInput.value = "";
  questExpInput.value = "";
});

document.getElementById("saveFeeling").addEventListener("click", () => {
  const text = document.getElementById("feelingInput").value;
  if(text.trim()) {
    alert("感情ログを保存しました！");
    document.getElementById("feelingInput").value = "";
  }
});

document.getElementById("debugBtn").addEventListener("click", () => {
  if(confirm("データをリセットしますか？")) {
    localStorage.clear();
    location.reload();
  }
});

window.addEventListener("DOMContentLoaded", () => {
  if(player.name){
    welcomeText.innerText = `ようこそ、${player.name}。`;
  }
  playerNameInput.value = player.name;

  updateUI();
  renderQuests();
});
</script>

</body>
</html>
