<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LEVEL:ME</title>

  <!-- フォント -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#0F1115;
      color:#F3F4F6;
      font-family:'Inter', sans-serif;
      min-height:100vh;
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    .app{
      max-width:500px;
      margin:auto;
      padding:20px;
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }

    .small-text{
      color:#888;
      font-size:12px;
    }

    h1{
      font-size:42px;
    }

    .card{
      background:#181C23;
      border:1px solid rgba(255,255,255,0.05);
      border-radius:20px;
      padding:20px;
      margin-bottom:16px;
      backdrop-filter:blur(10px);
      transition:0.3s;
    }

    .streak-box{
      background:#222833;
      padding:10px 14px;
      border-radius:14px;
      font-weight:600;
    }

    .exp-top{
      display:flex;
      justify-content:space-between;
      margin-bottom:10px;
    }

    .exp-bar{
      width:100%;
      height:16px;
      background:#2A2F3A;
      border-radius:999px;
      overflow:hidden;
    }

    .exp-fill{
      width:0%;
      height:100%;
      background:linear-gradient(90deg,#FFD166,#7C5CFF);
      transition:0.4s;
      box-shadow: 0 0 10px rgba(255,209,102,0.5);
    }

    .message{
      font-size:18px;
      line-height:1.6;
      color:#DDD;
    }

    .status-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:16px;
    }

    .status-item{
      background:#222833;
      padding:16px;
      border-radius:16px;
    }

    .status-item span{
      display:block;
      color:#AAA;
      margin-bottom:6px;
    }

    .status-item strong{
      font-size:24px;
    }

    .quest{
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:#222833;
      padding:14px;
      border-radius:14px;
      margin-top:12px;
    }

    .quest-info span.tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
      background: #333a4d;
      color: #FFD166;
      margin-right: 6px;
    }

    .quest-info span.rank-tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
      background: #00D1B2;
      color: #000;
      font-weight: bold;
    }

    .quest button{
      border:none;
      background:#7C5CFF;
      color:white;
      padding:10px 14px;
      border-radius:12px;
      cursor:pointer;
      transition:0.2s;
    }

    .quest button:active{
      transform:scale(0.92);
    }

    .quest button:disabled{
      background:#4ADE80;
      opacity:0.8;
      cursor:default;
    }

    textarea{
      width:100%;
      min-height:100px;
      margin-top:16px;
      background:#222833;
      border:none;
      border-radius:16px;
      padding:16px;
      color:white;
      resize:none;
      font-size: 14px;
    }

    #saveFeeling{
      width:100%;
      margin-top:12px;
      border:none;
      padding:14px;
      border-radius:14px;
      background:#00D1B2;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    .log-item {
      background: #222833;
      padding: 16px;
      border-radius:14px;
      margin-top: 12px;
    }

    .log-date {
      font-size: 11px;
      color: #888;
      margin-bottom: 6px;
    }

    .log-text {
      font-size: 14px;
      line-height: 1.5;
      color: #EEE;
      white-space: pre-wrap;
    }

    .log-del-btn {
      background: transparent;
      border: none;
      color: #FF4D4D;
      font-size: 11px;
      cursor: pointer;
      margin-top: 8px;
    }

    /* キャラクターアバター表示カード */
    .avatar-card {
      text-align: center;
      background: radial-gradient(circle, #222833, #181C23);
      border: 2px solid #7C5CFF;
      box-shadow: 0 0 20px rgba(124, 92, 255, 0.3);
      position: relative;
      overflow: hidden;
    }

    .avatar-frame {
      width: 140px;
      height: 140px;
      margin: 10px auto 16px auto;
      border-radius: 50%;
      background: #000;
      border: 3px solid #7C5CFF;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      box-shadow: 0 0 25px rgba(124, 92, 255, 0.6);
      animation: auraPulse 3s infinite alternate;
      overflow: hidden;
    }

    /* キャラクター画像 */
    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.5s ease;
    }

    @keyframes auraPulse {
      from {
        box-shadow: 0 0 15px rgba(124, 92, 255, 0.4), inset 0 0 10px rgba(124, 92, 255, 0.3);
      }
      to {
        box-shadow: 0 0 35px rgba(0, 209, 178, 0.8), inset 0 0 20px rgba(0, 209, 178, 0.5);
      }
    }

    .job-select-box {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .job-select-box select {
      flex: 1;
      background: #222833;
      border: none;
      border-radius: 12px;
      padding: 12px;
      color: white;
      font-size: 14px;
    }

    .levelup-modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.85);
      display:none;
      justify-content:center;
      align-items:center;
      z-index:999;
    }

    .levelup-content{
      background: radial-gradient(circle, #2a2f5f, #181C23);
      border:2px solid #FFD166;
      box-shadow: 0 0 20px #FFD166, 0 0 60px rgba(255,209,102,0.4);
      padding:40px;
      border-radius:24px;
      text-align:center;
      animation: pop 0.5s ease, glow 1.5s infinite alternate;
    }

    .levelup-content h2{
      font-size:40px;
      color:#FFD166;
    }

    .levelup-content p{
      font-size:28px;
      margin-top:10px;
    }

    .death-modal {
      position: fixed;
      inset: 0;
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      padding: 20px;
    }

    .death-content {
      background: #0A0C10;
      border: 1px solid #7C5CFF;
      box-shadow: 0 0 30px rgba(124, 92, 255, 0.4);
      padding: 30px;
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      animation: fadeIn 1s ease;
    }

    .death-title {
      font-size: 22px;
      color: #FF4D4D;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
    }

    .death-text {
      font-size: 14px;
      line-height: 1.8;
      color: #CCC;
      margin-bottom: 24px;
      text-align: left;
    }

    .death-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #7C5CFF, #00D1B2);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(124, 92, 255, 0.5);
      transition: 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes pop{
      0%{ transform:scale(0.6); opacity:0; }
      100%{ transform:scale(1); opacity:1; }
    }

    @keyframes glow{
      from{ box-shadow: 0 0 10px #FFD166, 0 0 30px rgba(255,209,102,0.2); }
      to{ box-shadow: 0 0 30px #FFD166, 0 0 80px rgba(255,209,102,0.6); }
    }

    #level{
      background:linear-gradient(90deg, #FFFFFF, #FFD166);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .name-box{
      display:flex;
      gap:10px;
      margin-top:14px;
    }

    .name-box input{
      flex:1;
      background:#222833;
      border:none;
      border-radius:12px;
      padding:14px;
      color:white;
      font-size:16px;
    }

    .name-box button{
      border:none;
      background:#7C5CFF;
      color:white;
      padding:0 18px;
      border-radius:12px;
      cursor:pointer;
    }

    #welcomeText{
      margin-top:14px;
      color:#AAA;
    }

    .title-box{
      margin-top:12px;
      background: linear-gradient(135deg, #7C5CFF, #00D1B2);
      padding:16px;
      border-radius:16px;
      text-align:center;
      box-shadow: 0 0 15px rgba(124,92,255,0.4);
    }

    #playerTitle{
      font-size:20px;
      font-weight:700;
      letter-spacing:1px;
    }

    .add-quest{
      display:flex;
      flex-direction: column;
      gap:10px;
      margin-top:16px;
      margin-bottom:16px;
    }

    .add-quest-row {
      display: flex;
      gap: 10px;
    }

    .add-quest input, .add-quest select{
      background:#222833;
      border:none;
      border-radius:12px;
      padding:12px;
      color:white;
    }

    #questNameInput{
      flex:1;
    }

    #questDifficultySelect, #questStatSelect {
      flex: 1;
    }

    #addQuestBtn{
      border:none;
      background:#00D1B2;
      color:white;
      border-radius:12px;
      padding:12px;
      font-weight:bold;
      cursor:pointer;
    }

    .chart-container {
      position: relative;
      width: 100%;
      max-width: 300px;
      margin: 0 auto;
      height: 250px;
    }

    #statusChart{
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    #debugBtn {
      background: transparent;
      border: 1px solid #444;
      color: #666;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 10px;
      cursor: pointer;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #181C23;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      z-index: 1000;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: #888;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: 0.2s;
    }

    .
</html>
